# taplo does not read `.gitignore`, so it formats what a build or a setup
# script leaves behind: `cargo package` writes a `Cargo.toml` under `target/`
# that it wants to reformat, which is #427. `**/` on each because taplo
# resolves a relative pattern against the working directory rather than against
# this file — and so these match a directory of that name anywhere.
exclude = [
  "**/.git/**",
  "**/target/**",
  "**/tmp/**",
  "**/result/**",
  "**/node_modules/**",
  "**/gitlab/**",
  "**/markdownlint/**",
]

[[rule]]
include = ["**/mado.toml"]

[rule.schema]
path = "./pkg/json-schema/mado.json"
