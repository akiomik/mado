# taplo walks the tree itself and knows nothing of git, so what a build or a
# setup script leaves behind is a file it tries to format. `cargo package`
# writes `target/package/<name>-<version>/Cargo.toml`, which cargo formats and
# taplo does not agree with, so `taplo format --check` failed and `just fmt`
# rewrote it — on a working tree with nothing wrong.
#
# So the generated and vendored directories are named, and everything else is
# formatted. `target` is cargo's, under the workspace root and under `fuzz/` in
# a checkout that predates `fuzz/` joining it; `tmp` is
# `scripts/acceptance/test.sh`'s and `result` is a nix build's; `node_modules`
# is what `scripts/benchmarks/comparison.sh` asks for with `npm ci`; `gitlab`
# and `markdownlint` are the two checkouts the setup scripts clone, and are the
# names those scripts' own `.gitignore` files use.
#
# Each begins `**/` because taplo resolves a relative pattern against the
# directory it is run in, not against this file. Written as `target/**` they
# match nothing from a subdirectory, and `taplo format` there rewrites the
# vendored checkouts — #427 again, one directory along. With `**/` the six hold
# from anywhere, which is more than the tree walk they replaced managed.
#
# The cost is that the list has to learn about a new generated directory. When
# it has not, the failure is #427: something gets rewritten that should not
# have been, the next time anyone runs `just fmt`. Loud, unlike an allowlist
# that has not learned about a new source file and simply stops checking it.
exclude = [
  "**/target/**",
  "**/tmp/**",
  "**/result/**",
  "**/node_modules/**",
  "**/data/gitlab/**",
  "**/data/markdownlint/**",
]

[[rule]]
include = ["**/mado.toml"]

[rule.schema]
path = "./pkg/json-schema/mado.json"
