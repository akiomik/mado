# taplo walks the tree itself and knows nothing of git, so what a build or a
# setup script leaves behind is a file it tries to format. `cargo package`
# writes `target/package/<name>-<version>/Cargo.toml`, which cargo formats and
# taplo does not agree with, so `taplo format --check` failed and `just fmt`
# rewrote it — on a working tree with nothing wrong.
#
# So the generated and vendored roots are named, and everything else is
# formatted. `target` and `fuzz/target` are cargo's, the second left behind by
# checkouts that predate `fuzz/` joining the workspace; `tmp` is
# `scripts/acceptance/test.sh`'s and `result` is a nix build's; `scripts/*/data`
# holds the two checkouts the setup scripts clone, one of them a GitLab tree
# whose own `.gitignore` runs to 594 entries; `node_modules` is what
# `scripts/benchmarks/comparison.sh` asks for with `npm ci`.
#
# Naming these rather than the places the repository's own TOMLs live, which
# was the other way round and is worse: an allowlist that has not learned about
# a new file leaves it unformatted and, for a `mado.toml`, unchecked against the
# schema below — quietly, and from a subdirectory it would collect nothing at
# all. A generated directory this list has not learned about fails the way #427
# did instead: loudly, the next time anyone runs `just fmt`.
exclude = [
  "target/**",
  "fuzz/target/**",
  "tmp/**",
  "result/**",
  "scripts/*/data/**",
  "scripts/**/node_modules/**",
]

[[rule]]
include = ["**/mado.toml"]

[rule.schema]
path = "./pkg/json-schema/mado.json"
