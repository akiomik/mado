[package]
name = "mado-fuzz"
version = "0.0.0"
publish = false
edition.workspace = true

[package.metadata]
cargo-fuzz = true

[lints]
workspace = true

[dependencies]
libfuzzer-sys = "0.4"
comrak.workspace = true

[dependencies.mado]
path = ".."

# One key each for `cargo test`, `cargo doc` and `cargo bench`, which is what
# keeps all three off the C++ toolchain `libfuzzer-sys` needs.
[[bin]]
name = "linter"
path = "fuzz_targets/linter.rs"
test = false
doc = false
bench = false
