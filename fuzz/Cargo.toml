[package]
name = "mado-fuzz"
version = "0.0.0"
publish = false
edition.workspace = true

[package.metadata]
cargo-fuzz = true

[lints]
workspace = true

[dependencies]
libfuzzer-sys = "0.4"
comrak.workspace = true

[dependencies.mado]
path = ".."

# `test`, `doc` and `bench` are what keep `cargo test` and `cargo doc` out of
# this package, and so off the C++ toolchain `libfuzzer-sys` needs.
[[bin]]
name = "linter"
path = "fuzz_targets/linter.rs"
test = false
doc = false
bench = false
