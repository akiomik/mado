[package]
name = "mado-fuzz"
version = "0.0.0"
publish = false
edition.workspace = true

[package.metadata]
cargo-fuzz = true

[lints]
workspace = true

[dependencies]
libfuzzer-sys = "0.4"
comrak.workspace = true

[dependencies.mado]
path = ".."

# `libfuzzer-sys` needs a C++ toolchain to build, and the `false`s below are
# what keep it out of the graph of every workspace-wide command.
[[bin]]
name = "linter"
path = "fuzz_targets/linter.rs"
test = false
doc = false
bench = false
