[package]
name = "mado-fuzz"
version = "0.0.0"
publish = false
edition.workspace = true

[package.metadata]
cargo-fuzz = true

[lints]
workspace = true

[dependencies]
libfuzzer-sys = "0.4"
comrak.workspace = true

[dependencies.mado]
path = ".."

# `test`, `doc` and `bench = false` are what keep this package out of `cargo
# test`, `cargo doc` and the coverage run, and so off the C++ toolchain
# `libfuzzer-sys` needs.
[[bin]]
name = "linter"
path = "fuzz_targets/linter.rs"
test = false
doc = false
bench = false
