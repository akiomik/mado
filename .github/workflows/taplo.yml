name: Taplo

on:
  push:
    branches:
      - main
  pull_request:

jobs:

  taplo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: uncenter/setup-taplo@b18c8c8302695fe63d6853bc004006215ac52b91 # v2
        with:
          version: "0.9.3"
      # The TOMLs this repository owns rather than every one in the tree: taplo
      # walks it itself and asks git nothing, and a job that built anything
      # first would be checking cargo's output too. The `fmt` recipe in the
      # justfile asks the same question; it has its own copy because nothing
      # here installs `just`.
      #
      # `shell: bash` for the `-o pipefail` it brings. The default is `bash -e`
      # without it, and a `git ls-files` that failed — no repository, a bad
      # index — would leave `xargs -r` nothing to do and this step green having
      # checked no files at all.
      - name: Run Taplo
        shell: bash
        run: git ls-files -z --cached --others --exclude-standard '*.toml' | xargs -0 -r taplo format --check
