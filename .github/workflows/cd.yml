name: CD # Continuous Deployment

on:
  push:
    # The action and the package manifests download from `v{version}`, so only
    # a tag spelled that way may release. `preflight` then checks the tag
    # against the version in the tree.
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: read

concurrency:
  # Publishing checks for an existing release and then creates one, so two runs
  # for a tag can both pass that check and race. Queue them instead. Never
  # cancel one part way through: it may be the run that has already published.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preflight:
    name: Check the tag
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7.0.1
      with:
        persist-credentials: false
    # CI runs this on pull requests and never sees a tag, but a tag can be
    # pushed at any commit, so the release is the last place a version the rest
    # of the tree disagrees with can still be stopped.
    - name: Check the tag against the version in the tree
      shell: bash
      run: bash scripts/release/check-versions.sh "$GITHUB_REF_NAME"
    # The release body is this tag's changelog section, and the job that reads
    # it runs after the matrix. A tag the changelog does not name would fail
    # there, having built five platforms first, so find that out up front.
    - name: Extract release notes
      shell: bash
      run: bash scripts/release/extract-changelog.sh "${GITHUB_REF_NAME#v}" > /dev/null

  # Builds the binaries, which runs the build scripts and proc macros of every
  # dependency, so these jobs can only read the repository. The publish job
  # uploads what they package.
  package:
    name: Package - ${{ matrix.platform.os-name }}
    needs: preflight
    runs-on: ${{ matrix.platform.runs-on }}

    strategy:
      fail-fast: false
      matrix:
        platform:
          # `archive` is the asset name that `action/entrypoint.sh`, the package
          # manifests and the `justfile` download, so it cannot change.
          - os-name: Linux-x86_64
            runs-on: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: mado-Linux-gnu-x86_64.tar.gz
          - os-name: Linux-aarch64
            runs-on: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            archive: mado-Linux-gnu-arm64.tar.gz
          - os-name: macOS-x86_64
            runs-on: macOS-latest
            target: x86_64-apple-darwin
            archive: mado-macOS-x86_64.tar.gz
          - os-name: macOS-aarch64
            runs-on: macOS-latest
            target: aarch64-apple-darwin
            archive: mado-macOS-arm64.tar.gz
          - os-name: Windows-x86_64
            runs-on: windows-latest
            target: x86_64-pc-windows-msvc
            archive: mado-Windows-msvc-x86_64.zip

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7.0.1
      with:
        persist-credentials: false
    - name: Install Rust toolchain
      uses: actions-rust-lang/setup-rust-toolchain@v2.0.0
      with:
        target: ${{ matrix.platform.target }}
        cache: false # CD runs months apart, so there is no cache worth restoring.
    - name: Build binary
      run: cargo build --locked --release --target ${{ matrix.platform.target }}
      env:
        CARGO_PROFILE_RELEASE_STRIP: true
    # Each archive holds the binary, CHANGELOG.md and README.md at its top
    # level, with a `.sha256` beside it, as `actions-rust-release` made them:
    # the `justfile` reads the hash from the start of that file.
    - name: Package artifacts (Unix)
      if: runner.os != 'Windows'
      shell: bash
      env:
        ARCHIVE: ${{ matrix.platform.archive }}
        TARGET: ${{ matrix.platform.target }}
      run: |
        staging="$(mktemp -d)"
        cp "target/${TARGET}/release/mado" CHANGELOG.md README.md "$staging"
        tar czf "$ARCHIVE" -C "$staging" mado CHANGELOG.md README.md
        shasum --algorithm 256 "$ARCHIVE" > "$ARCHIVE.sha256"
    - name: Package artifacts (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      env:
        ARCHIVE: ${{ matrix.platform.archive }}
        TARGET: ${{ matrix.platform.target }}
      run: |
        $staging = Join-Path $env:RUNNER_TEMP 'package'
        New-Item -ItemType Directory -Path $staging | Out-Null
        Copy-Item "target\$env:TARGET\release\mado.exe", CHANGELOG.md, README.md $staging
        7z a $env:ARCHIVE "$staging\*"
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        $hash = (Get-FileHash $env:ARCHIVE -Algorithm SHA256).Hash.ToLower()
        [IO.File]::WriteAllText("$PWD\$env:ARCHIVE.sha256", "$hash *$env:ARCHIVE`n")
    - uses: actions/upload-artifact@v7.0.2
      with:
        name: binary-${{ matrix.platform.os-name }}
        path: ${{ matrix.platform.archive }}*
        if-no-files-found: error
        # Long enough to re-run the publish job after a failed upload.
        retention-days: 7

  # Uploads the packaged binaries in one go. This is the only job that can
  # write to the repository, so it runs no build and no third-party action:
  # only this repository's changelog script and the runner's gh.
  publish:
    name: Publish GitHub release
    # One release for the whole matrix, created once every platform has
    # packaged, rather than one race per platform.
    needs: package
    runs-on: ubuntu-latest

    permissions:
      contents: write # Creating the release.

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7.0.1
      with:
        persist-credentials: false
    - name: Extract release notes
      shell: bash
      run: bash scripts/release/extract-changelog.sh "${GITHUB_REF_NAME#v}" > RELEASE_NOTES.md
    - uses: actions/download-artifact@v8.0.2
      with:
        pattern: binary-*
        path: dist
        merge-multiple: true
    # The package jobs name the files, so check that exactly the expected set
    # arrived before uploading any of it. Keep the names in step with the
    # package matrix.
    - name: Check the packaged files
      working-directory: dist
      run: |
        for archive in mado-Linux-gnu-x86_64.tar.gz mado-Linux-gnu-arm64.tar.gz mado-macOS-x86_64.tar.gz mado-macOS-arm64.tar.gz mado-Windows-msvc-x86_64.zip; do
          echo "$archive"
          echo "$archive.sha256"
        done | sort > ../expected.txt
        printf '%s\n' * | sort > ../actual.txt
        diff ../expected.txt ../actual.txt
    # Releases are made either by hand, which creates the tag and so starts
    # this workflow, or by pushing the tag. Add to the release when it exists,
    # keeping its notes, and otherwise create it with this tag's changelog
    # section. `--clobber` lets a re-run replace a partial upload with the same
    # files from this run's artifacts.
    - name: Upload to the release
      env:
        GH_TOKEN: ${{ github.token }}
        GH_REPO: ${{ github.repository }}
      run: |
        tags="$(gh release list --limit 1000 --json tagName --jq '.[].tagName')"
        if grep -qxF "$GITHUB_REF_NAME" <<< "$tags"; then
          gh release upload "$GITHUB_REF_NAME" --clobber dist/*
        else
          gh release create "$GITHUB_REF_NAME" --verify-tag --notes-file RELEASE_NOTES.md dist/*
        fi
