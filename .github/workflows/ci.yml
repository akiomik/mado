name: CI # Continuous Integration

on:
  push:
    branches:
      - main
  pull_request:

jobs:

  changelog:
    name: Changelog
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
      # CD builds the release body out of this section, so a version bump that
      # leaves the changelog on `## [Unreleased]` has to fail here rather than
      # at the tag.
      - name: Check release notes for the current version
        run: |
          version=$(bash scripts/release/version.sh)
          bash scripts/release/extract-changelog.sh "$version" > /dev/null

  version:
    name: Version
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
      # A tag whose `entrypoint.sh` or README pins were left behind ships the
      # previous release's binary to everyone using the action, and CD cannot
      # see it on its own: it only compares the tag against `Cargo.toml`.
      - name: Check the version is the same everywhere the tag carries it
        run: bash scripts/release/check-versions.sh

  test:
    name: Test Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v2.0.1
      - name: Run tests
        run: cargo test --locked --all-features --workspace
        env:
          CLICOLOR_FORCE: true
          TZ: 'Asia/Tokyo'

  rustfmt:
    name: Rustfmt
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v2.0.1
        with:
          components: rustfmt
          cache: false # rustfmt builds nothing to cache.
      - name: Check formatting
        run: cargo fmt --all --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v2.0.1
        with:
          components: clippy
      # `--workspace` reaches the fuzz target, whose `libfuzzer-sys` compiles a
      # vendored libFuzzer. `ubuntu-latest` ships a C++ compiler, so the step is
      # here to say what the job depends on rather than to buy it: it installs
      # only when there is none, and a mirror having a bad minute cannot fail a
      # lint. On this runner `c++` is the name `cc` looks for and `g++` the
      # package that carries it. `apt-get install` resolves a version out of the
      # image's index, so the guard updates that first.
      #
      # #428 is the same question for the C compiler every job that compiles
      # needs and none of them asks for.
      - name: Install a C++ toolchain for libfuzzer-sys
        run: |
          if ! command -v c++ > /dev/null; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends g++
          fi
      - name: Clippy check
        run: cargo clippy --locked --all-targets --all-features --workspace -- -D warnings

  docs:
    name: Docs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v2.0.1
      - name: Check documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --locked --no-deps --document-private-items --all-features --workspace

  coverage:
    name: Code Coverage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v2.0.1
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@v2.89.1
        with:
          tool: cargo-llvm-cov
      - name: Generate code coverage
        run: cargo llvm-cov --locked --all-features --workspace --lcov --output-path lcov.info
        env:
          CLICOLOR_FORCE: true
          TZ: 'Asia/Tokyo'
      # The upload runs in its own job so that `id-token: write` reaches only
      # the actions that need it. This job runs `taiki-e/install-action` and,
      # through setup-rust-toolchain's cache, `Swatinem/rust-cache`, which are
      # maintained by individuals, and any action in a job holding that
      # permission can request an OIDC token.
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: lcov
          path: lcov.info
          if-no-files-found: error
          retention-days: 1

  coverage-upload:
    name: Upload Coverage
    runs-on: ubuntu-latest
    needs: coverage
    permissions:
      contents: read
      id-token: write
    steps:
      # Codecov maps the report's paths onto the files tracked in the checkout.
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8.0.2
        with:
          name: lcov
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7.1.1
        with:
          use_oidc: true
          files: lcov.info
          fail_ci_if_error: false
