name: CI # Continuous Integration

on:
  push:
    branches:
      - main
  pull_request:

jobs:

  changelog:
    name: Changelog
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # CD builds the release body out of this section, so a version bump that
      # leaves the changelog on `## [Unreleased]` has to fail here rather than
      # at the tag.
      - name: Check release notes for the current version
        run: |
          version=$(bash scripts/release/version.sh)
          bash scripts/release/extract-changelog.sh "$version" > /dev/null

  version:
    name: Version
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # A tag whose `entrypoint.sh` or README pins were left behind ships the
      # previous release's binary to everyone using the action, and CD cannot
      # see it on its own: it only compares the tag against `Cargo.toml`.
      - name: Check the version is the same everywhere the tag carries it
        run: bash scripts/release/check-versions.sh

  test:
    name: Test Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: "1.91.1"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Run tests
        run: cargo test --locked --all-features --workspace
        env:
          CLICOLOR_FORCE: true
          TZ: 'Asia/Tokyo'

  rustfmt:
    name: Rustfmt
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: "1.91.1"
          components: rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Check formatting
        run: cargo fmt --all --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: "1.91.1"
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      # `--all-targets` reaches the fuzz target, which brings `libfuzzer-sys`,
      # whose build script compiles a vendored libFuzzer. That is a C++
      # compiler this job needs and the others do not.
      #
      # Asked for only when it is missing. `ubuntu-latest` ships one, so the
      # job says what it depends on without buying a network round trip for
      # it, and a mirror having a bad minute cannot fail a lint. `update`
      # inside the guard is not optional: `install` resolves a version out of
      # the index the image was built with, and an image without a compiler is
      # old enough for the archive to have dropped the version it names.
      #
      # The test is on `c++` because that is what runs. `cc` takes its C++
      # tool from `$CXX`, then `clang++` where clang is preferred, and
      # otherwise `c++`; `g++` is its answer on Solaris and illumos alone. The
      # package is still `g++`, that being what carries a C++ compiler here. A
      # runner where installing it leaves no `c++` behind fails the way it
      # would have without this step, so the guard cannot cost anything it
      # does not already save.
      #
      # Debian-family, like the `ubuntu-latest` this job has always run on.
      # #428 is the same question for the C compiler every job already needs
      # and none of them asks for, this one included until it moves.
      - name: Install a C++ toolchain for libfuzzer-sys
        run: |
          if ! command -v c++ > /dev/null; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends g++
          fi
      - name: Clippy check
        run: cargo clippy --locked --all-targets --all-features --workspace -- -D warnings

  docs:
    name: Docs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: "1.91.1"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Check documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --locked --no-deps --document-private-items --all-features --workspace

  coverage:
    name: Code Coverage
    runs-on: ubuntu-latest
    env:
      CARGO_TERM_COLOR: always
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: "1.91.1"
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@e67fa11c4b9316fa714ddf0abed07a0c3143b95b # v2.87.4
        with:
          tool: cargo-llvm-cov
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Generate code coverage
        run: cargo llvm-cov --locked --all-features --workspace --lcov --output-path lcov.info
        env:
          CLICOLOR_FORCE: true
          TZ: 'Asia/Tokyo'
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: lcov.info
          fail_ci_if_error: false
