name: CI Action # Continuous Integration

on:
  push:
    branches:
      - main
  pull_request:

jobs:

  download:
    name: Download - ${{ matrix.runs-on }}
    runs-on: ${{ matrix.runs-on }}

    strategy:
      fail-fast: false
      # The entrypoint builds the asset name from `uname -m`, which differs
      # between these two, so testing only one leaves the other's name
      # unchecked. Both are free for public repositories.
      matrix:
        runs-on:
          - ubuntu-latest
          - ubuntu-24.04-arm

    permissions:
      contents: read # Reading the newest release.

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The action downloads the release it was published with, and a version
      # bump names that release before the tag creating it exists, so testing
      # the default made this job fail on every bump. Point it at a release
      # that is there. The `version` job is what keeps the default from being
      # left behind; nothing downloads it until it has a tag.
      - name: Find the newest release
        id: release
        run: |
          if ! tag=$(gh release view --repo akiomik/mado --json tagName --jq .tagName) ||
            [ -z "$tag" ]; then
            echo "found no published release to test the action against" >&2
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Use local action
        uses: ./
        with:
          version: ${{ steps.release.outputs.tag }}

  # `Test Action` is a required status check on `main`, matched by name, so it
  # has to stay one context however many runners the matrix grows to. This job
  # is that name; the matrix reports under its own.
  test:
    name: Test Action
    needs: download
    if: always() # A failed matrix would otherwise skip this, and a skipped required check never reports.
    runs-on: ubuntu-latest

    permissions: {}

    steps:
      - name: Check the matrix result
        env:
          RESULT: ${{ needs.download.result }}
        run: |
          if [ "$RESULT" != "success" ]; then
            echo "the action's download matrix did not pass: $RESULT" >&2
            exit 1
          fi
