name: "mado-action"
description: "Run mado to check Markdown files"
author: "Akiomi Kamakura"
branding:
  icon: check
  color: white

inputs:
  args:
    description: "Arguments passed to Mado. Defaults to `check .`."
    required: false
    default: "check ."
  version:
    description: "Mado release to download, like `v0.3.1`. Defaults to the release this action was published with."
    required: false
    default: ""

runs:
  using: 'composite'
  steps:
    - id: mado
      shell: bash
      run: $GITHUB_ACTION_PATH/action/entrypoint.sh
      env:
        INSTALL_DIR: .
        INPUT_ARGS: ${{ inputs.args }}
        INPUT_VERSION: ${{ inputs.version }}
